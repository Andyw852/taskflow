# =====================================================================
# skill/band/templates/step.conf —— band 技能的【出厂默认值】
#
# 不要在这里改项目参数。tf init 会把本文件复制到
#     <材料>/band/project_setting/templates/step.conf
# 改那一份才只影响该材料。要给某个步骤单独设值，就在
#     <材料>/band/project_setting/templates/<步骤名>/step.conf
# 里写同名键（如 step2_PBE_static/step.conf），优先级更高。
#
# 生效顺序（越靠后越优先）：
#   skill/band/templates/step.conf
#     -> project_setting/templates/step.conf
#       -> project_setting/templates/<步骤名>/step.conf
# 查看最终生效值：  tf -tt bd -p <材料> -j <步骤> conf
# =====================================================================

[params]
# 结构优化泛函，决定 INCAR 的 GGA / IVDW，并由 step1 写进 workflow_method.txt
# 供 step2/3/4 继承（step4 的 HSE 泛函族也据此自动选 HSE06 / HSEsol）。
#   auto     嗅探 incar_*.tpl 里写死的 GGA/IVDW 反推；模板里是 {{GGA}} 占位符
#            （正常情况）就取脚本默认值 pbesol
#   pbe-d3   PBE + DFT-D3(BJ)  -> GGA=PE, IVDW=12
#   pbesol   PBEsol            -> GGA=PS, 无色散修正
#   pbe      纯 PBE            -> GGA=PE, 无色散修正
FUNC = pbesol
