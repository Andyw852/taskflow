# =============================================================================
# skill/ke/skill.yaml —— 电子热导率（AMSET）
#
# 【源目录：分组结构】大步骤是文件夹，里面套小步骤文件夹（v1.5 src 字段）：
#   skill/ke/
#   ├── step1_opt/                       结构优化（复用 elastic）
#   ├── bandgap/                         带隙大步骤（复用 band 全套）
#   │   ├── step2_static/
#   │   ├── step3_wavecar/
#   │   ├── step4_hse/
#   │   └── step4_plot/
#   ├── step5_uniform/                   密网格自洽（新）
#   ├── step6_wave/                      amset wave（新）
#   ├── step7_elastic/                   弹性常数（复用 elastic）
#   ├── step8_dielect/                   DFPT 介电（新）
#   ├── deform/                          形变势大步骤
#   │   ├── step9_deform/
#   │   └── step9b_read/
#   └── step10_amset/                    amset run（新）
#
# 【计算目录：平的】超算/本地 result 里仍是 step1_std_opt/、step2_PBE_static/…
#   —— 步骤名写死在 band/elastic 的 gen 脚本里且互相引用，不能改。
#   src 只决定「去技能目录哪个子文件夹取源文件」，与计算目录名无关。
#
# k 网格一律 VASPKIT（1→102→Γ心→kspacing），2D 用 force_kz1 压真空方向为 1。
# 每个 gen 脚本开头都有可改参数区（ENCUT/ISMEAR/KSPACING/KPAR/NCORE…）。
# =============================================================================
schema: 1
name: ke
desc: 电子热导率
version: "0.1"

template_layout: per_step
template_dir: "."

defaults:
  hpc: jzzn
  skill_subdir: true

fetch_files: [INCAR, POSCAR, CONTCAR, POTCAR, KPOINTS, KPOINTS_OPT, kpath.json,
              submit.sh, OUTCAR, EIGENVAL, vasprun.xml, queue.out, queue.err,
              workflow_method.txt, band_summary.json, settings.yaml,
              deformation.h5, transport.json, amset.log]

steps:
  - {seq: 1, name: step1_std_opt, label: S1_opt, src: step1_opt,
     check: outcar_relax, gen: gen_step1_std_opt.py, contcar_to_poscar: true,
     gen_need: [dim_common.py, check_common.py, step1_check_and_resubmit.py,
                incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 3, name: step5_uniform, label: S3_uniform, src: step5_uniform,
     check: wavecar, gen: gen_step5_uniform.py,
     gen_need: [dim_common.py, check_common.py,
                incar_uniform_2d.tpl, incar_uniform_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 4, name: step6_wave, label: S4_wave, src: step6_wave,
     check: marker, marker: "wavefunction.h5:", gen: gen_step6_wave.py,
     gen_need: [submit_amset.tpl]}

  - {seq: 5, name: step8_dielect, label: S5_dielect, src: step8_dielect,
     check: marker, marker: "OUTCAR:MACROSCOPIC STATIC DIELECTRIC TENSOR",
     gen: gen_step8_dielect.py,
     gen_need: [dim_common.py, check_common.py,
                incar_dfpt_2d.tpl, incar_dfpt_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 6, name: step7_elastic, label: S6_elastic, src: step7_elastic,
     check: marker, marker: "OUTCAR:TOTAL ELASTIC MODULI",
     gen: gen_step2_elastic.py,
     gen_need: [dim_common.py, check_common.py, step2_check_and_resubmit.py,
                submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 7, name: step9_deform, label: S7_deform, src: deform/step9_deform,
     check: outcar, fanout: "*deform*", gen: gen_step9_deform.py,
     gen_need: [dim_common.py, incar_deform_2d.tpl, incar_deform_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 7.1, name: step9b_deform_read, label: S7.1_read, src: deform/step9b_read,
     check: plot, run: gen, done_marker: deformation.h5,
     gen: gen_step9b_deform_read.py, gen_need: [], fetch_all: true}

  - {seq: 8, name: step10_amset, label: S8_kappa, src: step10_amset,
     check: marker, marker: "transport.json:thermal_conductivity",
     gen: gen_step10_amset.py, gen_need: [submit_amset.tpl], fetch_all: true}

# --- 2 带隙段：4 个子步嵌套进 step2_bandgap/，状态表合并成 S2_bandgap 一列 ----
# 深度可调（band 技能同款流程，泛函 pbe/pbesol 由 step1 弛豫继承）：
#   bandgap_depth 由项目配置控制 —— 但这里用两个可选组表达：
#     bandgap_steps  : 关掉 = 完全不算带隙（手填 setting.yaml 的 bandgap）
#     bandgap_hse    : 关掉 = 只到 PBE（跑 2.1 static + 2.2 wave + 2.4 gap，
#                      跳过 2.3 HSE），得 PBE/PBEsol 带隙；开 = 走到 HSE。
# 计算目录名（rename_bandgap.sh 已把 gen 脚本常量改成这些）：
#   step2_bandgap/step2.1_static  step2.2_wave  step2.3_hse  step2.4_gap
# group: S2_bandgap 让 4 子步在状态表合并为一列，第二行显示走到哪步。
optional_steps:
  bandgap_steps:
    default: true
    steps:
      - {seq: 2.1, name: "step2_bandgap/step2.1_static", label: S2.1_scf,
         group: S2_bandgap, after: step1_std_opt,
         src: bandgap/step2_static, check: outcar, gen: gen_step2_static.py,
         gen_need: [dim_common.py, check_common.py, step2_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl]}
      - {seq: 2.2, name: "step2_bandgap/step2.2_wave", label: S2.2_wave,
         group: S2_bandgap, after: "step2_bandgap/step2.1_static",
         src: bandgap/step3_wavecar, check: wavecar, gen: gen_step3_WAVECAR.py,
         gen_need: [dim_common.py, check_common.py, step3_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl,
                    submit_ncl_2d.tpl, submit_ncl_3d.tpl]}
      - {seq: 2.4, name: "step2_bandgap/step2.4_gap", label: S2.4_gap,
         group: S2_bandgap, after: "step2_bandgap/step2.2_wave",
         src: bandgap/step4_plot, check: plot, run: gen,
         done_marker: band_summary.json, gen: "gen_step4.1_plot_band.py",
         gen_need: [], fetch_all: true}
  # HSE 子步单独一组：默认开=走到 HSE 带隙；bandgap_hse: false 只到 PBE。
  # 它插在 2.2_wave 之后，2.4_gap 的画图脚本会自动认 step2.3_hse（存在就画 HSE，
  # 不存在就画 PBE，见 gen_step4.1_plot_band 的 --step4-dir 逻辑）。
  bandgap_hse:
    default: true
    steps:
      - {seq: 2.3, name: "step2_bandgap/step2.3_hse", label: S2.3_hse,
         group: S2_bandgap, after: "step2_bandgap/step2.2_wave",
         src: bandgap/step4_hse, check: outcar, gen: gen_step4_HSE.py,
         gen_need: [dim_common.py, check_common.py, step4_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl,
                    submit_ncl_2d.tpl, submit_ncl_3d.tpl]}

requires:
  python: [pymatgen, numpy, matplotlib, amset]
  conda: amset_clean
  exe: [vasp_std, vaspkit]
