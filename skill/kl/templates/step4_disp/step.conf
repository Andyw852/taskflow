# step4_disp 参数（超胞 + 位移，扇出）。
#   METHOD=findiff 对称有限位移；METHOD=alm 随机位移(位移数由 ALM 自由参数×OVERSAMPLE 估)
[params]
FUNC        = pbesol
METHOD      = findiff    # findiff | alm
MIN_SC_LEN  = 15.0       # 超胞每个非真空方向最小胞长(Å)
MAX_MULTIPLE= 6
SUPERCELL   =            # 显式 "3 3 3"；空=自动。2D 会把真空方向压 1
KAPPA_MESH  = 20 20 20   # BTE q 网格（写进 kl_params 供 step6；2D 自动 kz=1）
KSPACING    = 0.04
# --- findiff 专属 ---
FC3_CUTOFF_PAIR =        # 三阶对距离上限(Å)；空=全对称集(最准最贵)。大超胞务必设 4~6 控制帧数
# --- alm 专属 ---
OVERSAMPLE  = 5
ALM_CUT2    =            # 二阶截断(Å)，空=不截断
ALM_CUT3    = 5.0        # 三阶截断(Å)
